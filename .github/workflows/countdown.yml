
  name: Countdown
  on:
    schedule:
      - cron: "7 0 * * *"     # her gün 00:07 UTC
    workflow_dispatch:         # elle çalıştırma
  permissions:
    contents: write
  jobs:
    countdown:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Recompute days to kickoff
          run: |
            DAYS=$(( ( $(date -u -d "2026-06-11" +%s) - $(date -u +%s) ) / 86400 ))
            [ "$DAYS" -lt 0 ] && DAYS=0
            perl -0pi -e "s|<!--D-->.*?<!--/D-->|<!--D-->${DAYS}<!--/D-->|s" assets/countdown.svg
        - name: Commit if changed
          run: |
            if ! git diff --quiet assets/countdown.svg; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add assets/countdown.svg
              git commit -m "chore: refresh kickoff countdown"
              git push
            fi
