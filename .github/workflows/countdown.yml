
  name: Countdown
  on:
    schedule:
      - cron: "7 0 * * *"
    workflow_dispatch:
  permissions:
    contents: write
  jobs:
    countdown:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Recompute countdown
          run: |
            KICK=$(date -u -d "2026-06-11" +%s)
            END=$(date -u -d "2026-07-20" +%s)   # final ertesi
            NOW=$(date -u +%s)
            if [ "$NOW" -lt "$KICK" ]; then
              BIG=$(( (KICK - NOW) / 86400 )); LABEL="DAYS TO KICKOFF"
            elif [ "$NOW" -lt "$END" ]; then
              BIG="LIVE"; LABEL="TOURNAMENT ON"
            else
              BIG="🏆"; LABEL="FINISHED"
            fi
            perl -0pi -e "s|<!--D-->.*?<!--/D-->|<!--D-->${BIG}<!--/D-->|s" assets/countdown.svg
            perl -0pi -e "s|<!--L-->.*?<!--/L-->|<!--L-->${LABEL}<!--/L-->|s" assets/countdown.svg
        - name: Commit if changed
          run: |
            if ! git diff --quiet assets/countdown.svg; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add assets/countdown.svg
              git commit -m "chore: refresh kickoff countdown"
              git push
            fi
