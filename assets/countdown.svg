<svg width="860" height="150" viewBox="0 0 860 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FIFA World Cup 2026 countdown">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b46f1"/>
      <stop offset="1" stop-color="#2a32c4"/>
    </linearGradient>
  </defs>
  <rect width="860" height="150" rx="18" fill="url(#bg)"/>

  <!-- Generic trophy (no FIFA emblem / trademark) -->
  <text x="38" y="95" font-size="58">🏆</text>

  <!-- Title + dates -->
  <text x="112" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">FIFA World Cup 2026™</text>
  <text x="114" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c3c8ff">11 June &#8211; 19 July 2026</text>

  <!-- Days box (the number between the markers is rewritten by the Action) -->
  <rect x="648" y="30" width="180" height="90" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="738" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff"><!--D-->3<!--/D--></text>
  <text x="738" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#c3c8ff"><!--L-->DAYS TO KICKOFF<!--/L--></text>
</svg>
